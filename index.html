<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Otto Rothfusz. Personal brand strategist for industry leaders. Founder of Infoscale and Classy Society.">
<meta property="og:title" content="Otto Rothfusz">
<meta property="og:description" content="Turning attention into leverage.">
<meta property="og:image" content="poster-wide.jpg">
<meta name="theme-color" content="#000000">
<title>Otto Rothfusz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: one screen. Looping video behind, everything centered: name, one line, social pills, two links. Nothing to read. Single dark theme by choice. */
:root{
  --bg:#000; --fg:#fff; --dim:rgba(255,255,255,.62); --pill:rgba(255,255,255,.08); --pill-line:rgba(255,255,255,.14);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}

.hero{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000 url(poster-wide.jpg) center/cover}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:0;transition:opacity .8s ease}
.hero video.on{opacity:1}
.hero video.tall{display:none}
.hero video::-webkit-media-controls,.hero video::-webkit-media-controls-start-playback-button{display:none!important;-webkit-appearance:none}
.hero::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.58)}

.card{position:relative;z-index:1;text-align:center;padding:40px 20px;max-width:760px;opacity:0;transform:translateY(8px);transition:opacity .9s ease .2s,transform .9s ease .2s}
.ready .card{opacity:1;transform:none}
.leave .card,.leave .foot,.leave .hero video{opacity:0!important;transition:opacity .4s ease}
.sigmark{display:block;width:120px;height:auto;margin:0 auto 22px;opacity:.9}
.tag{font-size:clamp(36px,6vw,74px);line-height:1.02;letter-spacing:-.04em;font-weight:500;margin:0 0 20px;text-wrap:balance}
.sub{margin:0 0 22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.line{font-size:clamp(16px,1.5vw,19px);line-height:1.55;color:rgba(255,255,255,.75);margin:0 auto 34px;max-width:52ch}
@media (max-width:520px){
  .line br{display:none}
  .sigmark{width:96px}
  .line{font-size:15px;max-width:30ch;margin-bottom:30px;color:rgba(255,255,255,.7)}
  .tag{font-size:40px;margin-bottom:16px}
  .menu{gap:14px;font-size:16px}
  .menu a{border-bottom:none;padding:0}
  .hero::after{background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.55) 45%,rgba(0,0,0,.7))}
}
.line a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35)}
.line a:hover{border-color:#fff}
.actions{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 26px}
.btn{display:inline-flex;align-items:center;height:46px;padding:0 24px;border-radius:999px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);text-decoration:none;font-size:15px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.14);border-color:#fff}
.menu{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin:0;padding:0;list-style:none;font-size:15px}
.menu a{text-decoration:none;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:2px;transition:border-color .15s}
.menu a:hover{border-color:#fff}
.menu .sep{color:rgba(255,255,255,.35)}
.foot a{text-decoration:none;color:rgba(255,255,255,.55)}
.foot a:hover{color:#fff}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;justify-content:center;flex-wrap:wrap;gap:10px;font-size:12px;color:rgba(255,255,255,.4);padding:0 20px calc(18px + env(safe-area-inset-bottom,0px))}
.foot a{text-decoration:none;color:rgba(255,255,255,.55)}
.foot a:hover{color:#fff}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
@media (max-width:760px){
  .hero{background-image:url(poster.jpg)}
  .hero video.wide{display:none}.hero video.tall{display:block}
}
@media (prefers-reduced-motion:reduce){.card,.hero video{transition:none}}
</style>
</head>
<body>


<section class="hero">
  <video class="wide" autoplay muted loop playsinline webkit-playsinline disablepictureinpicture disableremoteplayback poster="poster-wide.jpg" preload="auto">
    <source src="reel-wide.mp4" type="video/mp4">
  </video>
  <video class="tall" autoplay muted loop playsinline webkit-playsinline disablepictureinpicture disableremoteplayback poster="poster.jpg" preload="auto">
    <source src="reel.mp4" type="video/mp4">
  </video>

  <div class="card">
    <img class="sigmark" src="sig.png" alt="Otto Rothfusz">
    <h1 class="tag">Turning attention into leverage.</h1>
    <p class="line">Personal brand strategist for industry leaders. <br>Founder of <a href="https://infoscale.io" target="_blank" rel="noopener">Infoscale</a> and <a href="https://www.instagram.com/clasysociety" target="_blank" rel="noopener">Classy Society</a> (1M+). 3B+ views generated.</p>
    <ul class="menu">
      <li><a href="https://infoscale.io" target="_blank" rel="noopener">infoscale.io</a></li>
      <li class="sep">/</li>
      <li><a href="https://www.instagram.com/ottorothfusz" target="_blank" rel="noopener">instagram</a></li>
    </ul>
  </div>

  <div class="foot"><span>amsterdam</span><span>·</span><a href="careers.html" id="careers">careers</a><span>·</span><span>© 2026 otto rothfusz</span></div>
</section>

<script>
(function(){
  var vids=[].slice.call(document.querySelectorAll('.hero video'));
  function active(){return vids.filter(function(v){return getComputedStyle(v).display!=='none';});}
  function go(){active().forEach(function(v){v.muted=true;v.defaultMuted=true;var p=v.play();if(p&&p.catch)p.catch(function(){});});}
  vids.forEach(function(v){v.addEventListener('playing',function(){v.classList.add('on');});});
  go();
  requestAnimationFrame(function(){document.documentElement.classList.add('ready');});
  ['touchstart','touchend','click','scroll','pointerdown'].forEach(function(e){window.addEventListener(e,go,{passive:true});});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)go();});
  var c=document.getElementById("careers");c.addEventListener("click",function(e){e.preventDefault();document.documentElement.classList.add("leave");setTimeout(function(){location.href="careers.html";},420);});
})();
</script>
</body>
</html>
